<main>
  <h1>Wallet 가계부</h1>
  <p>두 사람(부부)이 함께 쓰는 개인용 가계부 앱입니다. 일반에 공개된 서비스가 아니며 가입을 받지 않습니다.</p>

  <h2>하는 일</h2>
  <ul>
    <li>공용 Gmail 계정으로 받은 뱅크샐러드 "내보내기" 메일의 첨부 파일(거래 내역)을 읽어 비공개 가계부 데이터베이스에 저장합니다.</li>
    <li>처리한 메일에 라벨을 붙여 같은 메일을 다시 처리하지 않게 합니다.</li>
  </ul>

  <h2>Google 계정 권한</h2>
  <p>Gmail API 권한은 위의 두 가지 일에만 씁니다. 메일을 보내거나 지우지 않고, 다른 메일의 내용을 저장하지 않습니다.</p>

  <p><a href="privacy.html">개인정보처리방침</a></p>
